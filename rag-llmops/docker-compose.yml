version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: llmops_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: llmops_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d llmops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: