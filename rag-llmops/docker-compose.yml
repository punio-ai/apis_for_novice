version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: llmops_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: llmops_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d llmops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  langfuse:
      image: langfuse/langfuse:2 # <-- PINNED TO V2. NO CLICKHOUSE REQUIRED.
      container_name: llmops_langfuse
      environment:
        - DATABASE_URL=postgresql://admin:securepassword123@db:5432/llmops_db
        - NEXTAUTH_SECRET=my-super-secret-key-change-this-in-prod
        - NEXTAUTH_URL=http://localhost:3000
        - SALT=mysalt-change-this-in-prod
        - ENCRYPTION_KEY=68f3617a8264b5930cc112f6d4c4a56c76f05636995c444d73319a3561b28b02
      ports:
        - "3000:3000"
      depends_on:
        db:
          condition: service_healthy

volumes:
  pgdata: